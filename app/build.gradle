plugins {
    id 'com.android.application'
}

// Número de versión: lo pone GitHub en cada compilación (1, 2, 3…)
def codigoVersion = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.suso.listacompra'
    compileSdk 34

    defaultConfig {
        applicationId 'com.suso.listacompra'
        minSdk 24
        targetSdk 34
        versionCode codigoVersion
        versionName "1.${codigoVersion}"
    }

    signingConfigs {
        // La firma NO está en el repositorio: GitHub la crea en cada compilación a partir
        // de los secretos KEYSTORE_B64 y KEYSTORE_PASS (Settings → Secrets → Actions).
        firma {
            storeFile file('listacompra.keystore')
            storeType 'pkcs12'
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias 'listacompra'
            keyPassword System.getenv('KEYSTORE_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.firma
        }
        debug {
            signingConfig signingConfigs.firma
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
