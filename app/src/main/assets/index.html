<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lista de la compra</title>
<style>
:root{--verde:#2e7d32;--verde2:#43a047;--verdeclaro:#e8f5e9;--fondo:#f3f5f2;--tarjeta:#fff;--texto:#1c2a1e;--gris:#6d7b70;--linea:#e2e8e1;--rojo:#c62828;--ambar:#ef8f00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:19px}
html.letra-normal{font-size:16px}html.letra-muy{font-size:22px}
body{margin:0;font-family:system-ui,Roboto,"Segoe UI",sans-serif;background:var(--fondo);color:var(--texto);-webkit-user-select:none;user-select:none;padding-bottom:6rem}
input,select,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.fila1{display:flex;align-items:center;gap:.4rem;padding:.55rem .7rem .25rem}
.fila1 h1{font-size:1.05rem;margin:0;flex:1;font-weight:600;opacity:.95}
.sync{font-size:.7rem;background:rgba(255,255,255,.18);padding:.2rem .55rem;border-radius:1rem;white-space:nowrap}
.sync.off{background:rgba(0,0,0,.25)}.sync.err{background:#b71c1c}
.icono{font-size:1.35rem;width:2.4rem;height:2.4rem;border-radius:50%;color:#fff}
.icono:active{background:rgba(255,255,255,.2)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.35rem .7rem .65rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:rgba(255,255,255,.16);color:#fff;border-radius:2rem;padding:.42rem .9rem;font-size:.92rem;white-space:nowrap}
.chip b{display:inline-block;min-width:1.35em;margin-left:.3em;padding:0 .35em;border-radius:1em;background:rgba(0,0,0,.18);font-size:.8em}
.chip.sel{background:#fff;color:var(--verde);font-weight:600}
.chip.sel b{background:var(--verde);color:#fff}
.barra{position:sticky;top:var(--alto-cab,6.4rem);z-index:4;display:flex;gap:.45rem;padding:.6rem .7rem;background:var(--fondo)}
.barra input{flex:1;min-width:0;border:2px solid var(--linea);border-radius:.8rem;padding:.65rem .8rem;background:#fff;outline:none}
.barra input:focus{border-color:var(--verde2)}
.redondo{flex:none;width:3rem;height:3rem;border-radius:50%;background:var(--verde);color:#fff;font-size:1.3rem;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.redondo:active{transform:scale(.93)}
.redondo svg{width:1.45rem;height:1.45rem;display:block;margin:auto}
.redondo.escuchando{background:var(--rojo);animation:latido 1s infinite}
@keyframes latido{50%{box-shadow:0 0 0 .5rem rgba(198,40,40,.25)}}
.sugerencias{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 .7rem}
.sugerencias:empty{display:none}
.sug{background:#fff;border:1px solid var(--linea);border-radius:2rem;padding:.4rem .8rem;font-size:.9rem}
main{padding:.2rem .7rem 1rem}
.seccion{margin:.8rem 0 .35rem;font-size:.82rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:.4rem}
.seccion .ico{width:1.25rem;height:1.25rem;color:var(--verde);opacity:.9}
svg.ico{width:1.1em;height:1.1em;vertical-align:-.2em;flex:none}
.fila1 h1 .ico{width:1.2em;height:1.2em;margin-right:.25rem;vertical-align:-.22em}
.icono .ico{width:1.45rem;height:1.45rem;display:block;margin:auto}
.flotante .ico{margin-right:.35rem}
.check .ico{width:1.05rem;height:1.05rem}
.editar .ico{width:1.2rem;height:1.2rem;display:block;margin:auto}
.vacio .ico{width:3.2rem;height:3.2rem;color:#b9c4ba}
.sug .ico,.hab .ico{width:1.05em;height:1.05em;margin-right:.3em;opacity:.8}
.secs .ico{width:1.15em;height:1.15em;margin-right:.35em}
.orden .ico{width:1.15em;height:1.15em;margin-right:.4em;color:var(--verde)}
.grupo{background:var(--tarjeta);border-radius:.9rem;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden}
.item{display:flex;align-items:center;gap:.7rem;padding:.55rem .4rem .55rem .8rem;min-height:3.3rem;border-top:1px solid var(--linea)}
.item:first-child{border-top:0}
.item:active{background:var(--verdeclaro)}
.check{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:2.5px solid #b9c4ba;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff}
.txt{flex:1;min-width:0;line-height:1.25}
.nom{font-weight:600;word-break:break-word}
.cant{display:inline-block;margin-left:.35rem;background:var(--verdeclaro);color:var(--verde);border-radius:.5rem;padding:0 .4rem;font-size:.85em;font-weight:700}
.por{display:block;font-size:.72rem;color:var(--gris);margin-top:.1rem}
.editar{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;color:var(--gris);font-size:1.1rem}
.editar:active{background:var(--linea)}
.hecho .check{background:var(--verde2);border-color:var(--verde2)}
.hecho .nom{text-decoration:line-through;color:var(--gris);font-weight:400}
.hecho .cant{background:#eee;color:var(--gris)}
.carro-cab{display:flex;align-items:center;gap:.5rem;margin:1.3rem 0 .4rem}
.carro-cab button.ver{flex:1;text-align:left;font-weight:700;color:var(--gris);font-size:.9rem;padding:.4rem 0}
.carro-cab button.vaciar{background:#fff;border:1px solid var(--linea);border-radius:2rem;padding:.35rem .8rem;font-size:.85rem;color:var(--rojo)}
.vacio{text-align:center;color:var(--gris);padding:2.5rem 1rem}
.vacio div{line-height:1}
.flotante{position:fixed;right:1rem;bottom:1.1rem;z-index:6;background:var(--ambar);color:#fff;border-radius:2rem;padding:.8rem 1.15rem;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.flotante:active{transform:scale(.96)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.oculto{display:none}
.hoja{background:#fff;width:100%;max-width:40rem;max-height:92vh;overflow-y:auto;border-radius:1.2rem 1.2rem 0 0;padding:1.1rem 1rem 1.4rem;animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(30%);opacity:.3}}
.hoja h2{margin:0 0 .7rem;font-size:1.2rem}
.hoja h3{margin:1.3rem 0 .4rem;font-size:.95rem;color:var(--verde)}
.hoja label{display:block;font-size:.8rem;color:var(--gris);margin:.75rem 0 .25rem;font-weight:600}
.hoja input:not([type=checkbox]),.hoja select,.hoja textarea{width:100%;border:2px solid var(--linea);border-radius:.7rem;padding:.6rem .7rem;background:#fff;outline:none}
.hoja input:focus,.hoja textarea:focus,.hoja select:focus{border-color:var(--verde2)}
.hoja textarea{min-height:5rem;font-size:.85rem}
.nota{font-size:.8rem;color:var(--gris);margin:.4rem 0;line-height:1.4}
.nota a{color:var(--verde)}
.botones{display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap}
.botones button,.boton{flex:1;min-width:7rem;padding:.78rem .8rem;border-radius:.8rem;background:#eef1ee;font-weight:600;text-align:center}
.botones button.prim,.boton.prim{background:var(--verde);color:#fff}
.botones button.peligro{background:#fdecea;color:var(--rojo)}
.botones button:disabled{opacity:.45}
.bloque{display:block;width:100%;margin-top:.55rem}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.3rem,1fr));gap:.35rem}
.secs button{background:#f1f4f0;border-radius:.6rem;padding:.5rem .4rem;font-size:.82rem;text-align:left}
.secs button.sel{background:var(--verde);color:#fff;font-weight:600}
.hgrid{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.hab{background:#f1f4f0;border-radius:2rem;padding:.5rem .85rem;font-size:.92rem}
.hab.ya{background:var(--verde);color:#fff}
.hab.borrar{background:#fdecea;color:var(--rojo)}
.rfila{display:flex;gap:.35rem;align-items:center;padding:.35rem 0;border-top:1px solid var(--linea)}
.rfila input[type=checkbox]{width:1.5rem;height:1.5rem;flex:none;accent-color:var(--verde)}
.hoja .rfila .rs{flex:none;width:4.9rem;padding:.55rem .2rem;border-radius:.6rem;background:#f1f4f0;font-size:.72rem;font-weight:600;color:var(--gris);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoja .rfila .rn{flex:1;min-width:0}
.hoja .rfila .rc{width:5.2rem;flex:none}
.rfila.no{opacity:.5}
.ya-esta{display:block;font-size:.7rem;color:var(--ambar);margin:-.2rem 0 .2rem 2rem}
.mini{display:block;max-width:100%;max-height:11rem;margin:0 auto .6rem;border-radius:.6rem}
.dicho{background:var(--verdeclaro);border-radius:.6rem;padding:.5rem .7rem;font-size:.9rem;margin:.2rem 0 .6rem}
.cargando{display:flex;align-items:center;gap:.6rem;padding:1rem .2rem;color:var(--gris)}
.spin{width:1.4rem;height:1.4rem;border:3px solid var(--linea);border-top-color:var(--verde);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.err{color:var(--rojo);font-size:.88rem;background:#fdecea;padding:.5rem .7rem;border-radius:.6rem}
.orden{display:flex;align-items:center;gap:.3rem;padding:.2rem 0;border-top:1px solid var(--linea)}
.orden span{flex:1}
.orden button{width:2.4rem;height:2.2rem;border-radius:.5rem;background:#f1f4f0}
.codigo{font-family:monospace;font-size:.72rem;word-break:break-all;background:#f1f4f0;padding:.5rem;border-radius:.5rem}
pre.registro{font-size:.62rem;white-space:pre-wrap;word-break:break-all;background:#1d2420;color:#cfe8d2;padding:.6rem;border-radius:.6rem;max-height:50vh;overflow:auto;-webkit-user-select:text;user-select:text}
.opciones3{display:flex;gap:.4rem}.opciones3 button{flex:1;padding:.6rem;border-radius:.6rem;background:#f1f4f0}.opciones3 button.sel{background:var(--verde);color:#fff}
.act{display:flex;align-items:center;gap:.7rem;margin:.2rem .7rem .4rem;padding:.7rem .8rem;border-radius:.9rem;background:#fff;border:2px solid var(--verde2);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.act svg{flex:none;width:1.5rem;height:1.5rem;color:var(--verde)}
.act .t{flex:1;min-width:0;line-height:1.3}.act .t b{display:block}.act .t span{font-size:.8rem;color:var(--gris)}
.act button{flex:none;background:var(--verde);color:#fff;border-radius:2rem;padding:.55rem .95rem;font-weight:700;font-size:.9rem}
.act .barra-prog{height:.35rem;background:var(--linea);border-radius:1rem;margin-top:.35rem;overflow:hidden}.act .barra-prog i{display:block;height:100%;background:var(--verde2);transition:width .2s}
.toast{position:fixed;left:50%;bottom:5.6rem;transform:translateX(-50%);z-index:30;background:#263028;color:#fff;border-radius:.8rem;padding:.75rem 1.1rem;font-size:.9rem;line-height:1.35;display:flex;gap:1rem;align-items:center;justify-content:space-between;width:max-content;max-width:calc(100vw - 2rem);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast span{flex:1;min-width:0}
.toast.oculto{display:none}.toast.error{background:var(--rojo)}
.toast button{flex:none;white-space:nowrap;color:#9be7a1;font-weight:700;text-transform:uppercase;font-size:.85rem;padding:.2rem 0}
.sugs{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
</style>
</head>
<body>
<header id="cab">
  <div class="fila1"><h1><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.2"/></svg>Lista de la compra</h1><span id="sync" class="sync off">…</span><button id="bAjustes" class="icono" aria-label="Ajustes"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg></button></div>
  <div id="chips" class="chips"></div>
</header>
<div id="barra" class="barra">
  <input id="entrada" placeholder="Añadir producto…" enterkeyhint="done" autocomplete="off" autocapitalize="sentences">
  <button id="bVoz" class="redondo" aria-label="Dictar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg></button>
  <button id="bFoto" class="redondo" aria-label="Foto de una lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.8-2.5h6.4L17 8h3a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.4"/></svg></button>
</div>
<div id="sugerencias" class="sugerencias"></div>
<div id="avisoAct"></div>
<main id="lista"></main>
<button id="bHab" class="flotante"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>Habituales</button>
<div id="modal" class="modal oculto"><div class="hoja" id="hoja"></div></div>
<div id="toast" class="toast oculto"></div>
<input id="fichero" type="file" accept="image/*" style="display:none">

<script>
'use strict';
const VERSION_WEB='1.0';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AND=window.Android||null;
const esperar=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ Guardar en el móvil ============ */
const store={
  get(k){try{if(AND){const v=AND.get(k);return v===''||v==null?null:v;}return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{if(AND)AND.set(k,v==null?'':String(v));else if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,String(v));}catch(e){}}
};
let CFG={nombre:'',db:'',hogar:'',gemini:'',modelo:'gemini-flash-latest',letra:'grande',lista:''};
try{Object.assign(CFG,JSON.parse(store.get('cfg')||'{}'));}catch(e){}
function guardarCfg(){store.set('cfg',JSON.stringify(CFG));}

/* ============ Registro de pruebas ============ */
const REG=[];
function log(...a){
  const t=new Date().toTimeString().slice(0,8);
  let s=a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ');
  if(CFG.gemini)s=s.split(CFG.gemini).join('***');
  REG.push(t+' '+s);if(REG.length>300)REG.shift();
}

/* ============ Secciones del súper ============ */
const SECCIONES=[['fruta','','Fruta y verdura'],['carne','','Carne'],['pescado','','Pescado'],['charcuteria','','Charcutería y quesos'],['lacteos','','Lácteos y huevos'],['pan','','Pan y bollería'],['despensa','','Despensa'],['congelados','','Congelados'],['bebidas','','Bebidas'],['limpieza','','Limpieza'],['higiene','','Higiene y farmacia'],['mascotas','','Mascotas'],['otros','','Otros']];
const ICONOS={
fruta:'<path d="M12 8c-1.6-1.4-5.6-1.8-6.9 1.5-1.3 3.4.6 9.1 3.5 10.6 1.4.7 2.2-.2 3.4-.2s2 .9 3.4.2c2.9-1.5 4.8-7.2 3.5-10.6C17.6 6.2 13.6 6.6 12 8z"/><path d="M12 8c0-2.2.9-3.7 2.8-4.3"/>',
carne:'<path d="M13.5 3.5c3.6-1 7.3 2.6 6.4 6.3-.8 3.2-4.3 5.6-7.4 5.2L9 18.5"/><path d="M13.5 3.5c-3.1.9-5.4 4.4-5 7.4L5 14.5"/><path d="M5 14.5a1.8 1.8 0 1 0-1.1 3.4 1.8 1.8 0 1 0 3.4 1.1L9 18.5"/>',
pescado:'<path d="M2.5 12c3-4.6 8.8-6.1 13.3-3.1L20.5 5.5v13l-4.7-3.4C11.3 18.1 5.5 16.6 2.5 12z"/><path d="M7.5 11.2v.1"/>',
charcuteria:'<path d="M3 15.5 13.5 7l7.5 3.7v8.8H3z"/><path d="M3 15.5h18"/><path d="M8 18.2v.1M15.5 13v.1"/>',
lacteos:'<path d="M8.5 2.5h7v3.3l2.5 3.7v12h-12v-12l2.5-3.7z"/><path d="M6 9.5h12M8.5 5.8h7"/>',
pan:'<path d="M6 20.5v-9.3A4 4 0 0 1 7 3.5h10a4 4 0 0 1 1 7.7v9.3z"/><path d="M10 8v3M14 8v3"/>',
despensa:'<rect x="5.5" y="7.5" width="13" height="14" rx="2"/><path d="M7 3.5h10v4H7zM5.5 12.5h13"/>',
congelados:'<path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6"/><path d="M9.5 4 12 6.5 14.5 4M9.5 20l2.5-2.5 2.5 2.5"/>',
bebidas:'<path d="M10 2.5h4v4.3l1.9 2.8c.4.6.6 1.3.6 2V20a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 20v-8.4c0-.7.2-1.4.6-2L10 6.8z"/><path d="M7.5 14h9"/>',
limpieza:'<path d="M7.5 10.5h7v10a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z"/><path d="M9 10.5v-4h4v4M8 6.5h7.5l1.5-3H10"/><path d="M19.5 6.5h1.5M19 9l1.2.9M19 4l1.2-.9"/>',
higiene:'<path d="M7.5 10h9v10a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 20z"/><path d="M10.5 10V7h3v3M12 7V4H8.5"/><path d="M10 15.5h4M12 13.5v4"/>',
mascotas:'<circle cx="6.5" cy="10.5" r="1.7"/><circle cx="10" cy="6.5" r="1.7"/><circle cx="14" cy="6.5" r="1.7"/><circle cx="17.5" cy="10.5" r="1.7"/><path d="M8.3 17.6c0-2.7 1.7-5.3 3.7-5.3s3.7 2.6 3.7 5.3c0 1.7-1.4 2.6-3.7 2.6s-3.7-.9-3.7-2.6z"/>',
otros:'<path d="M5 8h14l-1.1 12.5a1 1 0 0 1-1 .9H7.1a1 1 0 0 1-1-.9z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
carrito:'<circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.2"/>',
ajustes:'<path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/>',
estrella:'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>',
lapiz:'<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 7.5l3 3"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
cesta:'<path d="M3 10h18l-1.8 9.2a1.5 1.5 0 0 1-1.5 1.3H6.3a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M7.5 10l3-6M16.5 10l-3-6M9 14v3M15 14v3M12 14v3"/>',
lista:'<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>',

DIC_ARR.sort((a,b)=>b[0].length-a[0].length);
function seccionDiccionario(nombre){
  const n=' '+norm(nombre).replace(/[^a-z0-9]+/g,' ').trim()+' ';
  for(const [w,sec] of DIC_ARR){
    if(w.length<=3){if(new RegExp(' '+w+'(e?s)? ').test(n))return sec;}
    else if(n.includes(' '+w))return sec;
  }
  return 'otros';
}

  if(h&&SEC[h.seccion])return h.seccion;
  if(propuesta&&SEC[propuesta])return propuesta;
  return seccionDiccionario(nombre);
}

/* ============ Entender "2 barras de pan", "leche x2"… ============ */
const NUM={un:1,una:1,uno:1,dos:2,'dúas':2,duas:2,tres:3,cuatro:4,catro:4,cinco:5,seis:6,siete:7,sete:7,ocho:8,oito:8,nueve:9,nove:9,diez:10,dez:10,once:11,doce:12,quince:15,veinte:20,media:'1/2',medio:'1/2'};
const UNID='kg|kilos?|g|gr|gramos?|l|litros?|docenas?|paquetes?|botes?|latas?|barras?|bolsas?|cajas?|botellas?|briks?|bricks?|tarros?|packs?|bandejas?|unidades?|piezas?|garrafas?|rollos?|sobres?|tabletas?|mallas?|manojos?|cuartos?';
const NUMW=Object.keys(NUM).sort((a,b)=>b.length-a.length).join('|');
const RE_INI=new RegExp('^(\\d+(?:[.,]\\d+)?|(?:'+NUMW+')(?=\\s))\\s*(?:('+UNID+')(?=\\s|$|\\.)\\.?)?\\s*(?:de\\s+)?','i');
function parseLinea(txt){
  let s=String(txt||'').trim().replace(/^[-•*·]+\s*/,'').replace(/[.]+$/,'').trim();
  if(!s)return null;
  let cantidad='';
  const m=s.match(RE_INI);
  if(m&&m[0].length<s.length){
    const bruto=m[1].toLowerCase();
    const n=/^\d/.test(bruto)?bruto:NUM[bruto];
    const resto=s.slice(m[0].length).trim();
    if(resto){
      s=resto;
      if(m[2])cantidad=n+' '+m[2].toLowerCase();
      else if(String(n)!=='1')cantidad=String(n);
    }
  }
  if(!cantidad){
    const t=s.match(/^(.*?)\s*(?:(?:x|×)\s*(\d+)|\((\d+)\)|\s(\d+))$/i);
    if(t&&t[1]){s=t[1];cantidad=t[2]||t[3]||t[4];}
  }
  s=cap(s);
  return s?{nombre:s,cantidad}:null;
}
function trocearTexto(t){
  const sinUn=Object.keys(NUM).filter(k=>!['un','una','uno','media','medio'].includes(k)).join('|');
  return String(t||'')
    .split(/[,;\n]+|\s+(?:y|e|también|tambien|además|ademas|luego|después|despues|más|mas)\s+/i)
    .flatMap(c=>c.split(new RegExp('\\s+(?=(?:\\d+|'+sinUn+')\\s)','i')))
    .map(parseLinea).filter(Boolean);
}

let httpSeq=0;const httpCb={};
window.__http=(id,status,text)=>{const cb=httpCb[id];delete httpCb[id];if(cb)cb({status,text:text||''});};
function http(method,url,body,headers){
  return new Promise(res=>{
    if(AND){const id='h'+(++httpSeq);httpCb[id]=res;AND.http(id,method,url,body==null?'':body,JSON.stringify(headers||{}));}
    else fetch(url,{method,body:body==null?undefined:body,headers:headers||{}})
      .then(async r=>res({status:r.status,text:await r.text()}))
      .catch(e=>res({status:0,text:String(e)}));

}

function normalizarD(){
  if(!D||typeof D!=='object')D={};

const esDemo=()=>CFG.db==='demo';
const configurado=()=>!!(CFG.db&&CFG.hogar);
const BASE=()=>CFG.db.replace(/\/+$/,'')+'/hogares/'+CFG.hogar;

const partes=p=>String(p||'').split('/').filter(Boolean);
function getAt(o,ps){for(const k of ps){if(o==null||typeof o!=='object')return undefined;o=o[k];}return o;}
function resolverSV(v,actual){
  if(v&&typeof v==='object'){
    if('.sv' in v){const sv=v['.sv'];if(sv==='timestamp')return Date.now();if(sv&&sv.increment!=null)return (typeof actual==='number'?actual:0)+sv.increment;return null;}
    const r={};for(const k in v){const x=resolverSV(v[k],actual&&typeof actual==='object'?actual[k]:undefined);if(x!=null)r[k]=x;}
    return Object.keys(r).length?r:null;
  }
  return v;
}
function ponerEn(arbol,ps,val){
  if(!ps.length)return (val&&typeof val==='object')?val:{};
  let o=arbol;
  for(let i=0;i<ps.length-1;i++){
    const k=ps[i];
    if(o[k]==null||typeof o[k]!=='object'){if(val==null)return arbol;o[k]={};}
    o=o[k];
  }
  const ult=ps[ps.length-1];
  if(val==null)delete o[ult];else o[ult]=val;
  return arbol;
}
function aplicar(arbol,metodo,ruta,valor){
  const ps=partes(ruta);
  if(metodo==='DELETE')return ponerEn(arbol,ps,null);
  if(metodo==='PUT')return ponerEn(arbol,ps,resolverSV(valor,getAt(arbol,ps)));
  if(metodo==='PATCH'&&valor&&typeof valor==='object'){
    for(const k in valor){const sub=ps.concat(partes(k));arbol=ponerEn(arbol,sub,resolverSV(valor[k],getAt(arbol,sub)));}
  }
  return arbol;
}
function escribir(metodo,ruta,valor){
  D=aplicar(D,metodo,ruta,valor);normalizarD();guardarCache();render();refrescarModal();
  if(esDemo()||!configurado())return;
  pend.push({m:metodo,p:ruta,v:valor});guardarPend();pintarSync();vaciarPend();
}
let enviando=false;
async function vaciarPend(){
  if(enviando||!pend.length||esDemo()||!configurado())return;
  enviando=true;
  try{
    while(pend.length){
      const op=pend[0];
      const url=BASE()+(op.p?'/'+op.p:'')+'.json';
      const r=await http(op.m,url,op.m==='DELETE'?null:JSON.stringify(op.v),{'Content-Type':'application/json'});
      if(r.status>=200&&r.status<300){pend.shift();guardarPend();continue;}
      log('Escritura',op.m,op.p,'→',r.status,r.text.slice(0,200));
      if(r.status===400){pend.shift();guardarPend();continue;}
      if(r.status===401||r.status===403){if(estadoSync!=='err')aviso('Firebase no deja guardar. Revisa las reglas de la base de datos (README, paso 1).',true);estadoSync='err';}
      break;
    }
  }finally{enviando=false;pintarSync();}
}

/* ---- Escuchar cambios en directo ---- */
let estadoSync='off',es=null,primeraCarga=true;
function idsItems(){const s=new Set();for(const l in D.items)for(const i in D.items[l]||{})s.add(l+'/'+i);return s;}
function alRecibir(ev,dataStr){
  if(ev==='keep-alive')return;
  if(ev==='cancel'||ev==='auth_revoked'){estadoSync='err';pintarSync();aviso('Firebase ha cortado la conexión: permiso denegado. Revisa las reglas (README).',true);log('SSE',ev,dataStr);return;}
  if(ev!=='put'&&ev!=='patch')return;
  let msg;try{msg=JSON.parse(dataStr);}catch(e){return;}
  if(!msg)return;
  const antes=idsItems();
  if(ev==='put'&&partes(msg.path).length===0){
    D=(msg.data&&typeof msg.data==='object')?msg.data:{};
    normalizarD();
    for(const op of pend)D=aplicar(D,op.m,op.p,op.v);
  }else D=aplicar(D,ev==='put'?'PUT':'PATCH',msg.path,msg.data);
  normalizarD();
  if(!primeraCarga)avisarNuevos(antes);
  primeraCarga=false;
  guardarCache();render();refrescarModal();
}
function avisarNuevos(antes){
  const nuevos={};
  for(const l in D.items)for(const i in D.items[l]||{}){
    const it=D.items[l][i];
    if(!antes.has(l+'/'+i)&&it&&it.por&&it.por!==CFG.nombre)(nuevos[it.por]=nuevos[it.por]||[]).push(it.nombre);
  }
  const quien=Object.keys(nuevos);
  if(quien.length)aviso(quien.map(q=>`${q} ha añadido: ${nuevos[q].slice(0,5).join(', ')}${nuevos[q].length>5?'…':''}`).join(' · '));
}
window.__sse=alRecibir;
window.__sseEstado=ok=>{if(estadoSync==='err'&&!ok)return;estadoSync=ok?'on':'off';pintarSync();if(ok)vaciarPend();};
window.__sseError=(code,txt)=>{log('Directo HTTP',code,String(txt).slice(0,200));if(code===401||code===403){estadoSync='err';pintarSync();}};
function conectar(){
  if(esDemo()||!configurado()){pintarSync();return;}
  estadoSync='off';
  const url=BASE()+'.json';
  log('Conectando a',url);
  if(AND){AND.streamStart(url);}
  else{
    if(es)es.close();
    es=new EventSource(url);
    es.onopen=()=>window.__sseEstado(true);
    es.onerror=()=>window.__sseEstado(false);
    ['put','patch','keep-alive','cancel','auth_revoked'].forEach(e=>es.addEventListener(e,x=>alRecibir(e,x.data)));
  }
  pintarSync();
}
window.alVolver=()=>{if(configurado())conectar();comprobarActualizacion(false);};
function pintarSync(){
  const el=$('#sync');
  let t,c='';
  if(esDemo()){t='modo prueba';c='off';}
  else if(!configurado()){t='sin configurar';c='off';}
  else if(estadoSync==='err'){t='error';c='err';}
  else if(estadoSync==='on'){t=pend.length?'⟳ guardando':'● al día';}
  else{t=pend.length?`○ sin conexión (${pend.length})`:'○ sin conexión';c='off';}
  el.textContent=t;el.className='sync '+c;
}

function codigoAleatorio(n){const a='abcdefghjkmnpqrstuvwxyz23456789';const b=new Uint8Array(n);crypto.getRandomValues(b);return Array.from(b,x=>a[x%a.length]).join('');}
function haceCuanto(t){if(!t)return'';const m=Math.round((Date.now()-t)/60000);if(m<1)return'ahora';if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;const d=Math.round(h/24);return d===1?'ayer':`hace ${d} días`;}

function listasOrdenadas(){return Object.keys(D.listas).sort((a,b)=>((D.listas[a].orden||0)-(D.listas[b].orden||0))||String(D.listas[a].nombre).localeCompare(String(D.listas[b].nombre)));}
function listaSel(){const ids=listasOrdenadas();if(!D.listas[CFG.lista]){CFG.lista=ids[0]||'';}return CFG.lista;}
function ordenSecciones(){
  const o=String((D.ajustes&&D.ajustes.orden)||'').split(',').filter(id=>SEC[id]);
  for(const s of SECCIONES)if(!o.includes(s[0]))o.push(s[0]);
  return o;
}
function itemsDe(L){return Object.entries(D.items[L]||{}).filter(([,it])=>it&&it.nombre).map(([id,it])=>Object.assign({id},it));}
function pendienteEnLista(L,k){return itemsDe(L).find(it=>!it.hecho&&clave(it.nombre)===k);}

function anadir(prods,L){
  L=L||listaSel();
  if(!L){aviso('Primero crea una lista',true);return 0;}
  const upd={},hab={};let n=0;
  const actuales=itemsDe(L);
  for(const p of prods){
    const nombre=cap(p.nombre);if(!nombre)continue;
    const k=clave(nombre);
    const sec=SEC[p.seccion]?p.seccion:seccionPara(nombre);
    const ya=actuales.find(it=>clave(it.nombre)===k);
    if(ya){
      upd[ya.id+'/hecho']=false;upd[ya.id+'/hechoPor']=null;upd[ya.id+'/cuando']=null;
      if(p.cantidad)upd[ya.id+'/cantidad']=String(p.cantidad);
      if(sec!==ya.seccion)upd[ya.id+'/seccion']=sec;
    }else{
      const id=nuevoId();
      upd[id]={nombre,cantidad:String(p.cantidad||''),seccion:sec,por:CFG.nombre||'',hecho:false,creado:{'.sv':'timestamp'}};
      actuales.push(Object.assign({id},upd[id]));
    }
    hab[k+'/nombre']=nombre;hab[k+'/seccion']=sec;hab[k+'/veces']={'.sv':{increment:1}};hab[k+'/ultima']={'.sv':'timestamp'};
    n++;
  }
  if(!n)return 0;
  escribir('PATCH','items/'+L,upd);
  escribir('PATCH','habituales',hab);
  return n;
}
function anadirTexto(v){
  const prods=String(v||'').split(/[,;\n]+/).map(parseLinea).filter(Boolean).map(p=>Object.assign(p,{seccion:seccionPara(p.nombre)}));
  if(!prods.length)return;
  anadir(prods);
  $('#entrada').value='';pintarSugerencias();
}
function alternar(L,id){
  const it=(D.items[L]||{})[id];if(!it)return;
  if(it.hecho)escribir('PATCH',`items/${L}/${id}`,{hecho:false,hechoPor:null,cuando:null});
  else escribir('PATCH',`items/${L}/${id}`,{hecho:true,hechoPor:CFG.nombre||'',cuando:{'.sv':'timestamp'}});
}
function borrarItems(L,ids,texto){
  const viejos={},upd={};
  for(const id of ids){const it=(D.items[L]||{})[id];if(it){viejos[id]=JSON.parse(JSON.stringify(it));upd[id]=null;}}
  if(!Object.keys(upd).length)return;
  escribir('PATCH','items/'+L,upd);

function filaItem(it){

/* ============ Gemini: leer letra a mano y ordenar lo dictado ============ */
const ESQUEMA={type:'OBJECT',properties:{productos:{type:'ARRAY',items:{type:'OBJECT',properties:{nombre:{type:'STRING'},cantidad:{type:'STRING'},seccion:{type:'STRING',enum:SECCIONES.map(s=>s[0])}},required:['nombre','seccion']}}},required:['productos']};
function promptBase(){

  return `Eres el ayudante de una app de lista de la compra de una familia de Galicia (España). Extrae los productos que hay que comprar.
Reglas:
- Un elemento por producto. "nombre": corto, en español, empezando por mayúscula y sin la cantidad (ej.: "Leche", "Papel higiénico", "Pechugas de pollo").
- Corrige faltas de ortografía y abreviaturas (ej.: "yog. nat" → "Yogures naturales"). Si algo está en gallego, ponlo en español.
- "cantidad": solo si se indica (ej.: "2", "1 kg", "6 latas", "media docena"). Si no se indica, cadena vacía.
- "seccion": una de estas claves: fruta (fruta y verdura), carne, pescado, charcuteria (embutidos y quesos), lacteos (leche, yogures, huevos, mantequilla), pan (pan y bollería), despensa (arroz, pasta, legumbres, conservas, aceite, café, galletas, salsas…), congelados, bebidas, limpieza, higiene (aseo, farmacia, bebé), mascotas, otros.
${hab?`- Si un producto es el mismo que alguno de estos que la familia compra a menudo, usa exactamente ese nombre: ${hab}.`:''}
`;
}
let MODELOS=null;
async function buscarModelo(excluir){
  if(!MODELOS){
    const r=await http('GET','https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',null,{'x-goog-api-key':CFG.gemini});
    if(r.status!==200){log('Lista de modelos',r.status,r.text.slice(0,200));return null;}
    let ms=[];try{ms=JSON.parse(r.text).models||[];}catch(e){}
    const nota=n=>{if(n==='gemini-flash-latest')return 999;if(n==='gemini-flash-lite-latest')return 500;const v=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);return v*10-(/lite/.test(n)?3:0)-(/preview/.test(n)?1:0);};
    MODELOS=ms.filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>String(m.name||'').replace(/^models\//,''))
      .filter(n=>/flash/.test(n)&&!/image|tts|audio|live|embed|thinking|exp|robotics|computer/.test(n))
      .sort((a,b)=>nota(b)-nota(a));
    log('Modelos flash disponibles:',MODELOS.slice(0,8).join(', '));
  }
  return MODELOS.find(m=>!(excluir&&excluir.has(m)))||null;
}
function mensajeGemini(r){
  const t=r.text||'';
  if(r.status===0)return 'No hay conexión a internet.';
  if(/API_KEY_INVALID|API key not valid/i.test(t))return 'La clave de Gemini no es válida. Revísala en Ajustes.';
  if(r.status===403)return 'La clave de Gemini no tiene permiso. Crea una nueva en aistudio.google.com.';
  if(r.status===429)return 'Se ha llegado al límite gratuito de Gemini por ahora. Espera un minuto y vuelve a probar.';
  if(r.status===400&&/location|region|country/i.test(t))return 'Gemini no está disponible desde aquí con esta clave.';
  return `Gemini ha fallado (código ${r.status}). Mira el registro en Ajustes.`;
}
async function gemini(parts){
  if(!CFG.gemini)throw new Error('Falta la clave de Gemini (Ajustes).');
  const cuerpo=JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:0.1,responseMimeType:'application/json',responseSchema:ESQUEMA}});
  let modelo=CFG.modelo||'gemini-flash-latest';
  const probados=new Set();
  for(let intento=0;intento<7;intento++){
    const t0=Date.now();
    const r=await http('POST',`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:generateContent`,cuerpo,{'Content-Type':'application/json','x-goog-api-key':CFG.gemini});
    log('Gemini',modelo,'→',r.status,(Date.now()-t0)+' ms');
    if(r.status===200){
      let txt='';
      try{const j=JSON.parse(r.text);txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');}catch(e){}
      txt=txt.replace(/^```(?:json)?\s*|\s*```$/g,'').trim();
      log('Respuesta:',txt.slice(0,500));
      let prods;try{prods=(JSON.parse(txt).productos||[]).filter(p=>p&&p.nombre);}catch(e){throw new Error('Gemini ha contestado algo raro. Vuelve a probar.');}
      if(modelo!==CFG.modelo){CFG.modelo=modelo;guardarCfg();log('Desde ahora uso el modelo',modelo);}
      return prods;
    }
    log('Error Gemini:',r.text.slice(0,400));
    const noExiste=r.status===404||(r.status===400&&/not found|not supported|unknown name.*model/i.test(r.text));
    const saturado=r.status===500||r.status===503||r.status===504||(r.status===429&&!/per day|PerDay/i.test(r.text)&&intento>0)||/overloaded|UNAVAILABLE|high demand/i.test(r.text);
    const cupoAgotado=r.status===429;
    if(noExiste||saturado||cupoAgotado){
      probados.add(modelo);
      // probar otro modelo: si no existe, enseguida; si está saturado, tras un reintento con el mismo
      if(noExiste||cupoAgotado||intento>=1){
        const otro=await buscarModelo(probados);
        if(otro){log('Cambio al modelo',otro);modelo=otro;await esperar(400);continue;}
      }
      if(saturado){await esperar(1200*(intento+1));continue;}
    }
    throw new Error(mensajeGemini(r));
  }
  throw new Error('Los servidores gratuitos de Gemini están saturados ahora mismo. Pulsa «Reintentar» en un par de minutos.');
}

function tomarFoto(camara){
  if(AND){AND.foto(!!camara);return;}
  const f=$('#fichero');f.value='';f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    window.__fotoCargando();
    const img=new Image();img.onload=()=>{
      const MAX=1800,esc2=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*esc2);c.height=Math.round(img.height*esc2);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      window.__foto(c.toDataURL('image/jpeg',.85).split(',')[1],'');
    };img.onerror=()=>window.__foto(null,'No se pudo leer la imagen');
    img.src=URL.createObjectURL(file);
  };f.click();
}
window.__fotoCargando=()=>{REV=null;abrirRevision({cargando:'Preparando la foto…'});};
window.__foto=(b64,err)=>{
  if(!b64){if(revAbierta()&&REV&&!REV.prods.length){REV=null;cerrar();}if(err)aviso(err,true);return;}
  leerFoto(b64);
};
async function leerFoto(b64){
  if(!revAbierta())REV=null;
  if(REV&&REV.foto===b64)REV.prods=REV.prods.filter(p=>p.ok&&p.nombre);
  abrirRevision({foto:b64,cargando:'Leyendo la lista… (unos segundos)',error:''});
  try{
    const prods=await gemini([{text:promptBase()+'\nLa imagen es una lista de la compra escrita a mano (papel, post-it o pizarra). Ignora lo que esté tachado, fechas, precios y dibujos. Si no ves ninguna lista, devuelve "productos" vacío.'},{inline_data:{mime_type:'image/jpeg',data:b64}}]);
    sumarProductos(prods);
    abrirRevision({cargando:''});
  }catch(e){abrirRevision({cargando:'',error:e.message});}
}

/* ---- Voz ---- */
function dictar(){
  if(!configurado()){bienvenida();return;}
  if(AND){$('#bVoz').classList.add('escuchando');AND.voz();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){aviso('Este navegador no tiene dictado por voz',true);return;}
  const rec=new SR();rec.lang='es-ES';rec.interimResults=false;
  $('#bVoz').classList.add('escuchando');
  rec.onresult=e=>window.__voz(e.results[0][0].transcript,'');
  rec.onerror=e=>window.__voz(null,'No se ha entendido ('+e.error+')');
  rec.onend=()=>$('#bVoz').classList.remove('escuchando');
  rec.start();
}
window.__voz=(texto,err)=>{
  $('#bVoz').classList.remove('escuchando');
  if(!texto){if(err)aviso(err,true);return;}
  log('Dictado:',texto);
  procesarDictado(texto);
};
async function procesarDictado(t){
  const previo=revAbierta()&&REV?REV.texto:'';
  if(!revAbierta())REV=null;
  const textoTotal=previo?previo+' · '+t:t;
  if(CFG.gemini){
    abrirRevision({texto:textoTotal,cargando:'Ordenando lo que has dicho…',error:''});
    let prods;
    try{prods=await gemini([{text:promptBase()+`\nEste texto es lo que alguien ha dictado en voz alta; puede no tener comas ni puntos, así que sepáralo en productos con sentido: «${t}»`}]);}
    catch(e){log('Gemini falló con el dictado, uso el método simple:',e.message);prods=trocearTexto(t);}
    sumarProductos(prods);
    abrirRevision({cargando:''});
  }else{
    abrirRevision({texto:textoTotal,error:''});
    sumarProductos(trocearTexto(t));
    abrirRevision({});
  }
}

const REPO='jesusvprado-cmd/cestadelacompra';

async function comprobarActualizacion(manual){
  if(!AND&&!manual)return;
  if(!manual&&Date.now()-ultimaComprob<3*3600*1000)return;
  ultimaComprob=Date.now();
  const r=await http('GET',`https://api.github.com/repos/${REPO}/releases/latest`,null,{'Accept':'application/vnd.github+json'});
  log('Buscar actualización →',r.status);
  if(r.status!==200){if(manual)aviso(r.status===404?'Todavía no hay versiones publicadas en GitHub.':'No se ha podido consultar GitHub ahora mismo.',r.status!==404);return;}
  let j;try{j=JSON.parse(r.text);}catch(e){return;}
  const codigo=parseInt(String(j.tag_name||'').replace(/\D/g,''))||0;
  const apk=(j.assets||[]).find(a=>/\.apk$/i.test(a.name||''));
  const mio=codigoApp();
  log('Versión publicada',codigo,'· instalada',mio);
  if(apk&&codigo>mio){
    if(!ACT||ACT.codigo!==codigo)ACT={codigo,nombre:j.name||('1.'+codigo),notas:String(j.body||'').trim().split('\n')[0],url:apk.browser_download_url,estado:'',pct:0};
    pintarAct();
    if(manual)aviso('Hay una versión nueva: '+ACT.nombre);

}

      if(ac.dataset.accion==='nuevaLista')nuevaLista();
      if(ac.dataset.accion==='verCarro'){verCarro=!verCarro;render();}
      if(ac.dataset.accion==='vaciar'){const ids=itemsDe(L).filter(it=>it.hecho).map(it=>it.id);borrarItems(L,ids,ids.length===1?'1 producto quitado del carro':`${ids.length} productos quitados del carro`);}
      return;
    }
    const it=e.target.closest('.item');if(it)alternar(L,it.dataset.id);
  });
  window.addEventListener('resize',()=>document.documentElement.style.setProperty('--alto-cab',$('#cab').offsetHeight+'px'));
}
function arrancar(){
  aplicarLetra();eventos();render();pintarSync();
  if(!CFG.nombre||!configurado())bienvenida();else conectar();
  setInterval(vaciarPend,15000);
  setInterval(()=>{if(!pila.length)render();},60000);
  setTimeout(()=>comprobarActualizacion(false),1500);
}
arrancar();
</script>
